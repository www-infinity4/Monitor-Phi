name: Wallet contract watch

on:
  push:
    branches: ["main"]
    paths:
      - "src/checks/wallet-contracts.js"
      - "scripts/check-wallet-contracts.js"
      - ".github/workflows/wallet-contract-watch.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Observe published wallet contracts
        run: node scripts/check-wallet-contracts.js
